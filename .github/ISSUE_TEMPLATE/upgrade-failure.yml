name: Upgrade failure / 升級失敗回報
description: Share a failed or stuck upgrade so the rules and docs can cover it / 回報失敗或卡住的升級
labels: ["upgrade-report"]
body:
  - type: markdown
    attributes:
      value: |
        **Redact before posting / 貼上前請先遮蔽**: user names (`C:\Users\<name>`), computer name, domain / network / tailnet names, e-mail, product keys.
        使用者名稱、電腦名稱、網域與網路名稱、Email、產品金鑰。
  - type: input
    id: versions
    attributes:
      label: From → to / 升級版本
      placeholder: "Windows 11 23H2 (22631) → 26H2 (26300)"
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Method / 升級方式
      options: ["ISO setup.exe", "Windows Update", "Installation Assistant", "Other / 其他"]
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Result and extend code / 錯誤碼與延伸碼
      description: "From Rollback\\setupact.log: Reporting post reboot event -> [...]"
      placeholder: "0xC1900101 - 0x2000D"
  - type: textarea
    id: symptom
    attributes:
      label: What happened / 發生了什麼
      description: Where it stopped, how long, whether it was force-restarted / 停在哪、多久、有沒有強制重開
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: diagnose.ps1 output (redacted) / 診斷腳本輸出（已遮蔽）
      render: text
  - type: textarea
    id: tail
    attributes:
      label: Last ~50 lines of setupact.log before the failure (redacted) / 失敗前約 50 行日誌（已遮蔽）
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Confirmation / 確認
      options:
        - label: I removed user names, machine names and keys / 我已遮蔽使用者名稱、電腦名稱和金鑰
          required: true
